<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neuer Eintrag</title>
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <header>
        <h1>Berichtsheft Tool</h1>
    </header>
    
    <main class="screen">
        <input type="date" class="action-btn secondary" id="datum" name="datum">
        
        <select class="action-btn secondary" id="auswahl" name="auswahl">
            <option value="">Bitte wählen...</option>
            <option value="option1">Krankheit</option>
            <option value="option2">Urlaub</option>
            <option value="option3">Freistellung</option>
        </select>
        
        <div class="comment-section">
            <textarea id="comment" name="comment" rows="5" placeholder="Geben Sie hier Ihren Kommentar ein..."></textarea>
        </div>
    </main>
    <div class="navbar only-mobile">
        <a>Einstellungen</a>
        <a class="active">Startseite</a>
        <a>Profil</a>
    </div>

</body>
</html>
